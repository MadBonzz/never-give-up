<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://never-give-up-red.vercel.app; connect-src 'self' https://api.github.com https://never-give-up-red.vercel.app; base-uri 'none'; form-action 'none'">
  <title>Add an X post · never give up</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../submit/submit.css">
  <script type="module" src="../submit/submit.js"></script>
</head>
<body>
  <main class="submission">
    <a class="back" href="../">← the wall</a>
    <h1>add an X post<span aria-hidden="true">.</span></h1>
    <form id="submission">
      <label for="post">X post link</label>
      <input id="post" name="post" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false"
             placeholder="https://x.com/…/status/…" required>
      <p class="hint">A post link adds all its photos. A /photo/2 link adds just the second one.</p>
      <button type="submit" class="publish">add to the wall ↗</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="result"></div>
    <details id="access">
      <summary>Publishing access</summary>
      <p>Use a fine-grained GitHub token for <strong>MadBonzz/never-give-up</strong> with <strong>Contents → Read and write</strong>. Select only this repository when creating it.</p>
      <p><a href="https://github.com/settings/personal-access-tokens/new?name=Never+give+up+gallery&amp;target_name=MadBonzz&amp;contents=write" target="_blank" rel="noopener noreferrer">Create token on GitHub ↗</a></p>
      <label for="token">GitHub token</label>
      <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="github_pat_…">
      <label class="remember"><input id="remember" type="checkbox"> Remember on this device</label>
      <button id="forget" type="button" hidden>Forget saved access</button>
    </details>
    <noscript><p>Enable JavaScript to extract and submit photos.</p></noscript>
  </main>
</body>
</html>
